name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lakol
          POSTGRES_PASSWORD: lakol
          POSTGRES_DB: lakol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lakol" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lakol:lakol@localhost:5432/lakol?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Images de production : construites à chaque commit, publiées sur GHCR pour
  # une version taguée (git tag v1.0.0 && git push --tags).
  docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [runner, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Les noms d'images Docker sont en minuscules (le propriétaire du dépôt a des majuscules).
      - name: Nom de l'image
        run: |
          name=lakol-${{ matrix.target == 'runner' && 'app' || 'tools' }}
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${name}" >> "$GITHUB_ENV"
      - name: Connexion à GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction (et publication pour une version)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
