name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lakol
          POSTGRES_PASSWORD: lakol
          POSTGRES_DB: lakol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lakol" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lakol:lakol@localhost:5432/lakol?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
