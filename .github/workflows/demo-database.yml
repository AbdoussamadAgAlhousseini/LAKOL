# Aperçu en ligne (Vercel) : crée les tables puis charge les écoles de démonstration
# dans la base indiquée par le secret DEMO_DATABASE_URL. Voir APERCU-VERCEL.md.
# Lancement manuel uniquement : onglet Actions > « Base de démonstration » > Run workflow.
# ATTENTION : efface tout le contenu de cette base. Ne jamais y mettre la base de production.
name: Base de démonstration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tapez EFFACER pour confirmer (toutes les données de la base de démonstration seront remplacées)"
        required: true

jobs:
  seed:
    runs-on: ubuntu-latest
    if: inputs.confirmation == 'EFFACER'
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
    steps:
      - name: Vérifier le secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DEMO_DATABASE_URL absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm db:seed
