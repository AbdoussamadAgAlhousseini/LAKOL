# Environnement local : base de données, Redis, stockage S3 et boîte mail de test.
#   docker compose up -d                          # services seuls (app lancée avec pnpm dev)
#   docker compose --profile app up -d --build    # + application conteneurisée (http://localhost:3000)
#   docker compose --profile demo run --rm demo   # charge les écoles de démonstration (efface la base !)
# Guide pas à pas : TESTER-EN-LOCAL.md
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakol
      POSTGRES_PASSWORD: lakol
      POSTGRES_DB: lakol
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakol"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lakol
      MINIO_ROOT_PASSWORD: lakol-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]

  # Migrations et initialisation (formules, permissions) avant chaque démarrage.
  migrate:
    profiles: ["app", "demo"]
    build:
      context: .
      target: tools
    image: lakol-tools:local
    environment: &appenv
      DATABASE_URL: postgresql://lakol:lakol@postgres:5432/lakol?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      STORAGE_DIR: /data/storage
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node_modules/.bin/tsx scripts/init-platform.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["app"]
    build:
      context: .
      target: runner
    image: lakol-app:local
    environment: *appenv
    ports: ["3000:3000"]
    volumes: [storage:/data/storage]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # Tâches de fond : les WhatsApp et emails simulés s'affichent dans ses logs.
  worker:
    profiles: ["app"]
    build: { context: ., target: tools }
    image: lakol-tools:local
    environment: *appenv
    volumes: [storage:/data/storage]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # Données de démonstration (écoles, élèves, notes, paiements…). Remet la base à zéro.
  demo:
    profiles: ["demo"]
    build: { context: ., target: tools }
    image: lakol-tools:local
    environment: *appenv
    command: ["node_modules/.bin/tsx", "prisma/seed.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
  storage:
