# Environnement local : base de données, Redis, stockage S3 et boîte mail de test.
#   docker compose up -d                # services seuls (app lancée avec pnpm dev)
#   docker compose --profile app up -d  # + application conteneurisée
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakol
      POSTGRES_PASSWORD: lakol
      POSTGRES_DB: lakol
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakol"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lakol
      MINIO_ROOT_PASSWORD: lakol-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]

  app:
    profiles: ["app"]
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://lakol:lakol@postgres:5432/lakol?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://lakol:lakol@postgres:5432/lakol?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  miniodata:
